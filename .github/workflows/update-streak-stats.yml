name: Update GitHub Streak

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/update-streak-stats.yml

permissions:
  contents: write

concurrency:
  group: streak-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Erickpe8&theme=transparent&hide_border=true&dates=7F7F7F
          path: github-streak.svg
          token: ${{ secrets.METRICS_TOKEN_ERICK }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-streak.svg
          git diff --staged --quiet || git commit -m "chore: update GitHub streak stats"
          git push
