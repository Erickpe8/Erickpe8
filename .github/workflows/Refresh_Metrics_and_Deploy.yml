name: Metrics + Deploy

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

  push:
    branches: ["main"]
    paths:
      - .github/workflows/Refresh_Metrics_and_Deploy.yml
      - index.html
      - main.js
      - components/**
      - assets/**

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1) Traer el repo
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2) Generar el SVG
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN_ERICK }}

          user: Erickpe8
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Bogota

          retries: 3
          delay: 20

          filename: github-metrics.svg
          output_action: none

      - name: Collect generated SVG
        run: |
          sudo install -o "$(id -un)" -g "$(id -gn)" -m 644 /metrics_renders/github-metrics.svg github-metrics.svg

      - name: Verify generated files
        run: |
          ls -la github-metrics.svg
          [ -f github-metrics.svg ] || { echo "github-metrics.svg missing"; exit 1; }

      # 2.1) Parchear SVG: transparente, sin sombras, y contribs en azul
      - name: Patch metrics SVG
        run: |
          python - << 'PY'
          from pathlib import Path
          import re

          def patch_metrics(path):
              p = Path(path)
              if not p.exists():
                  print("Skip (not found):", p)
                  return
              s = p.read_text(encoding="utf-8")

              m = re.search(r'<svg[^>]*\bwidth="(\d+)"[^>]*\bheight="(\d+)"', s)
              if "viewBox=" not in s and m:
                  w, h = m.group(1), m.group(2)
                  s = re.sub(r'<svg\b', f'<svg viewBox="0 0 {w} {h}" preserveAspectRatio="xMidYMid meet"', s, count=1)
              elif "preserveAspectRatio=" not in s:
                  s = re.sub(r'<svg\b', '<svg preserveAspectRatio="xMidYMid meet"', s, count=1)

              css = """
              svg{background:transparent!important}
              *{box-shadow:none!important;filter:none!important}
              rect[fill="#fff"],rect[fill="#ffffff"],rect[fill="white"]{fill:transparent!important}
              """

              if "<style>" in s:
                  s = s.replace("<style>", "<style>\n"+css+"\n", 1)
              else:
                  s = re.sub(r'(<svg[^>]*>)', r'\1\n<style>'+css+'</style>\n', s, count=1)

              if path == "github-metrics.svg":
                  green_to_blue = {
                      "#ebedf0": "#ebedf0",
                      "#9be9a8": "#cfe8ff",
                      "#40c463": "#7bbcff",
                      "#30a14e": "#2f81f7",
                      "#216e39": "#1f6feb",
                  }
                  for g, b in green_to_blue.items():
                      s = re.sub(re.escape(g), b, s, flags=re.IGNORECASE)
                  extra = {
                      "#c6e48b": "#cfe8ff",
                      "#7bc96f": "#7bbcff",
                      "#239a3b": "#2f81f7",
                      "#196127": "#1f6feb",
                  }
                  for g, b in extra.items():
                      s = re.sub(re.escape(g), b, s, flags=re.IGNORECASE)

              p.write_text(s, encoding="utf-8")
              print("Patched:", p)

          patch_metrics("github-metrics.svg")
          PY

      - name: Commit metrics SVG to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add github-metrics.svg
          git diff --staged --quiet || git commit -m "chore: update GitHub metrics chart"
          git push

      # 3) Armar carpeta del sitio a publicar
      - name: Build CSS
        run: |
          npm ci
          npm run build:css
          test -f assets/tailwind-built.css || { echo "tailwind-built.css missing"; exit 1; }

      - name: Prepare site
        run: |
          VERSION="${GITHUB_SHA:0:12}"
          mkdir -p site

          cp index.html site/
          cp github-metrics.svg site/
          cp main.js site/

          mkdir -p site/assets
          rsync -av \
            --exclude="streak.svg" \
            --exclude="streak-template.svg" \
            --exclude="*.json" \
            --exclude="tailwind-input.css" \
            assets/ site/assets/

          cp -r components "site/c-${VERSION}"

      - name: Stamp cache-bust version on deploy
        run: node scripts/stamp-site-version.mjs site/index.html
        env:
          BUILD_VERSION: ${{ github.sha }}

      # 4) Subir artefacto para Pages
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 5) Desplegar a GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
