    <script>
      (function () {
        function getSiteBase() {
          const { protocol, hostname, pathname } = location;
          if (protocol === "file:") {
            return new URL("./", location.href).href;
          }
          if (hostname.endsWith("github.io")) {
            const repo = pathname.split("/").filter(Boolean)[0];
            return repo ? `${location.origin}/${repo}/` : `${location.origin}/`;
          }
          return new URL("./", location.href).href;
        }

        function getAssetVersion() {
          const v = document.querySelector('meta[name="asset-version"]')?.content?.trim();
          return v && v !== "dev" ? v : "";
        }

        window.assetUrl = (relativePath) => {
          const url = new URL(relativePath.replace(/^\//, ""), getSiteBase());
          const version = getAssetVersion();
          if (version) url.searchParams.set("v", version);
          return url.href;
        };
      })();
    </script>
